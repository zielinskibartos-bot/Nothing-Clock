name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ustaw Gradle 8.14
        run: |
          sed -i 's/gradle-8.10.2-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.10.2-bin.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Ustaw AGP 8.11.1
        run: |
          sed -i 's/8\.8\.0/8.11.1/g' android/settings.gradle

      - name: Ustaw Kotlin 2.2.20
        run: |
          sed -i 's/2\.0\.20/2.2.20/g' android/settings.gradle
          sed -i 's/2\.0\.20/2.2.20/g' android/build.gradle || true

      - name: Pobierz i napraw zaleznosci
        run: |
          flutter pub get
          flutter pub add font_awesome_flutter:^10.12.0
          flutter pub get

      - name: Pokaz wersje
        run: |
          flutter --version
          java -version
          grep -n "com.android.application" android/settings.gradle || true
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle || true
          grep -n "font_awesome_flutter" pubspec.yaml || true

      - name: Zbuduj APK
        run: flutter build apk --release

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Clock-APK
          path: build/app/outputs/flutter-apk/app-release.apk
